# What q2-confluence needs on top of the QIIME 2 "qiime2" distribution's
# development environment: the linters. The tutorial site and its toolchain
# live in the thermo-hec-tutorial repository (2026-10-16). The base environment comes from the distribution's dev environment
# file, as in https://develop.qiime2.org/en/stable/plugins/how-to-guides/set-up-development-environment.html;
# this file is applied to it with `conda env update` (README, "Development
# installation"). 2026-10-16: replaced the metapackage-based file (2026.10 is
# unreleased, and its channel has no Apple Silicon build).
channels:
- conda-forge
- bioconda
dependencies:
  - flake8
  - pip
  - pip:
    - q2lint@https://github.com/qiime2/q2lint/archive/master.zip
