# What q2-confluence needs on top of the QIIME 2 "qiime2" distribution's
# released 2026.10 environment (https://install.qiime2.org): the linters.
# Applied with `conda env update -n rachis-qiime2-2026.10 --file <this file>`,
# then `make dev`. CI builds the same way (.github/workflows/ci.yml).
# 2026-10-28: the base moved from the distribution's dev/latest/passed file
# to the release.
channels:
- conda-forge
- bioconda
dependencies:
  - flake8
  - pip
  - pip:
    - q2lint@https://github.com/qiime2/q2lint/archive/master.zip
