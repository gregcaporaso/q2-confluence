# Development environment: the QIIME 2 2026.10 "qiime2" distribution (rachis-qiime2
# metapackage: q2-sample-classifier, q2-diversity, q2-taxa, q2-vizard, ...), sylph
# and sylph-tax for the sylph actions, the documentation toolchain (q2doc's dev
# branch needs 2026.10: it imports rachis_cli), and the linters.
#   conda env create -n q2-confluence-dev --file environment-files/q2-confluence-qiime2-dev.yml
#   conda activate q2-confluence-dev && make dev
# 2026-10-16: moved from the 2026.7 released channel to 2026.10 passed.
channels:
- https://packages.qiime2.org/qiime2/2026.10/qiime2/passed
- conda-forge
- bioconda
dependencies:
  - rachis-qiime2
  - sylph=1.0.0
  - sylph-tax=1.9.2
  - nodejs
  - flake8
  - pip
  - pip:
    - q2doc@git+https://github.com/qiime2/q2doc@dev
    - jupyter-book
    - q2lint@https://github.com/qiime2/q2lint/archive/master.zip
