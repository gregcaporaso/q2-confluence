# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: q2-confluence
  title: q2-confluence
  github: https://github.com/gregcaporaso/q2-confluence/

  references:
    rachis-glossary-target: https://news.rachis.org/en/latest/
    rachis-library-target: https://library.qiime2.org

  plugins:
    - type: executable
      path: q2doc-plug.py

  toc:
    - file: intro.md
    - file: tutorial.md
    - file: data-preparation.md

  downloads:
    - file: _static/environment.yml
      title: Conda environment file

site:
  template: book-theme
  options:
      folders: true
      pretty_urls: false
